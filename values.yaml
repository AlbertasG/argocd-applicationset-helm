# Default namespace for the ApplicationSet
namespace: argocd

# Array of ArgoCD Projects to be created
projects:
  # Example Project for production environment
  - name: production
    description: "Production environment project"
    sourceRepos:
      - https://github.com/your-org/production-apps.git
      - https://github.com/your-org/your-app.git
    destinations:
      - namespace: production
        server: https://kubernetes.default.svc
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"
    orphanedResources:
      warn: true
    syncWindows:
      - kind: allow
        schedule: "0 0 * * *"
        duration: "12h"
        applications:
          - "*"
        namespaces:
          - production

  # Example Project for development environment
  - name: development
    description: "Development environment project"
    sourceRepos:
      - https://github.com/your-org/dev-apps.git
      - https://github.com/your-org/your-app.git
    destinations:
      - namespace: development
        server: https://kubernetes.default.svc
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"
    orphanedResources:
      warn: true

