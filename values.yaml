# Common configuration options that can be used across all ApplicationSets
common:
  # Default labels to be applied to all ApplicationSets
  labels:
    # managed-by: helm
    # environment: production
  
  # Default annotations to be applied to all ApplicationSets
  annotations:
    # description: "Managed by Helm"
    # contact: "team@example.com"
  
  # Default sync policy that can be overridden by individual ApplicationSets
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
