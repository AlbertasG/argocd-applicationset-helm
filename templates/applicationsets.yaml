{{ $global := . }}
{{- range $applicationsets := .Values.applicationsets }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $applicationsets.name }}
  namespace: {{ $global.Values.namespace | default $global.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $applicationsets.name }}
    app.kubernetes.io/instance: {{ $global.Release.Name }}
    app.kubernetes.io/managed-by: Helm
spec:
  generators:
    {{- if $applicationsets.gitGenerator }}
    - git:
        repoURL: {{ $applicationsets.gitGenerator.repoURL }}
        branches: {{ $applicationsets.gitGenerator.branches | toJson }}
        {{- if $applicationsets.gitGenerator.files }}
        files:
        {{- range $applicationsets.gitGenerator.files }}
        - path: {{ .path }}
          {{- if .label }}
          label: {{ .label }}
          {{- end }}
        {{- end }}
        {{- end }}
    {{- end }}
    {{- if $applicationsets.clusterGenerator }}
    - clusters:
        selector:
          matchLabels:
            {{- toYaml $applicationsets.clusterGenerator.selector.matchLabels | nindent 12 }}
    {{- end }}
  template:
    metadata:
      name: '{{ $applicationsets.name }}-{{ "{{name}}" }}'
      namespace: {{ $global.Values.namespace | default $global.Release.Namespace }}
      labels:
        app.kubernetes.io/name: {{ $applicationsets.name }}
        app.kubernetes.io/instance: {{ $global.Release.Name }}
        app.kubernetes.io/managed-by: Helm
    spec:
      project: {{ $applicationsets.project | default "default" }}
      source:
        repoURL: {{ $applicationsets.source.repoURL }}
        targetRevision: {{ $applicationsets.source.targetRevision | default "HEAD" }}
        path: {{ $applicationsets.source.path }}
        {{- if $applicationsets.source.helm }}
        helm:
          {{- toYaml $applicationsets.source.helm | nindent 10 }}
        {{- end }}
      destination:
        server: '{{ "{{server}}" }}'
        namespace: {{ $applicationsets.destination.namespace | default "default" }}
      syncPolicy:
        automated:
          prune: {{ $applicationsets.syncPolicy.automated.prune | default false }}
          selfHeal: {{ $applicationsets.syncPolicy.automated.selfHeal | default false }}
        {{- if $applicationsets.syncPolicy.syncOptions }}
        syncOptions:
        {{- range $applicationsets.syncPolicy.syncOptions }}
        - {{ . }}
        {{- end }}
        {{- end }}
{{- end }}
